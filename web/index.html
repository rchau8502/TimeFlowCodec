<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeFlowCodec WebAssembly Player</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: var(--muted);
      margin-top: 0.5rem;
      font-size: 0.95rem;
    }
    .player-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .screen-area {
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 400px;
    }
    canvas {
      max-width: 100%;
      max-height: 480px;
      display: block;
      image-rendering: pixelated;
    }
    .drop-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.85);
      border: 2px dashed var(--border);
      border-radius: 12px 12px 0 0;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .drop-overlay.dragover {
      background: rgba(30, 41, 59, 0.95);
      border-color: var(--accent);
    }
    .controls {
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .timeline-row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .buttons-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .left-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .stats {
      font-size: 0.85rem;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>TimeFlowCodec WASM Player</h1>
    <p class="subtitle">Real-time browser &lt;canvas&gt; decoding via WebAssembly ANSI C reference core</p>
  </header>

  <div class="player-container">
    <div class="screen-area" id="screenArea">
      <canvas id="viewCanvas" width="640" height="360"></canvas>
      <div class="drop-overlay" id="dropOverlay">
        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="color: var(--accent); margin-bottom: 0.75rem;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
        </svg>
        <p style="font-weight: 600; font-size: 1rem;">Drop a .tfc video file here</p>
        <p style="color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem;">or click to select file from disk</p>
        <input type="file" id="fileInput" accept=".tfc" style="display: none;">
      </div>
    </div>

    <div class="controls">
      <div class="timeline-row">
        <span id="currentTime" class="stats">0:00</span>
        <input type="range" id="timeSlider" min="0" max="0" value="0" disabled>
        <span id="totalTime" class="stats">0:00</span>
      </div>

      <div class="buttons-row">
        <div class="left-controls">
          <button id="playBtn" disabled>Play</button>
          <button id="restartBtn" disabled>Restart</button>
          <span id="statusText" class="stats">Ready. Load .tfc file.</span>
        </div>
        <div class="right-controls stats" id="metaStats">
          WASM Ready <span class="badge" id="fpsBadge">-- FPS</span>
        </div>
      </div>
    </div>
  </div>

  <script src="tfc_player.js"></script>
</body>
</html>
