name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libzstd-dev zlib1g-dev build-essential libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg zstd || true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[bench,gui,dev]"
      - name: Lint
        run: ruff check .
      - name: Build C Reference Decoder (libtfc)
        run: |
          cd libtfc
          make
          ./build/tfc_dec --help || true
          cd ..
      - name: Unit tests
        run: pytest -v -o faulthandler_timeout=120
      - name: Smoke CLI
        run: |
          python -m timeflowcodec -h || true
          timeflowcompress --help
          timeflowdecompress --help
      - name: Generate synthetic clips
        run: |
          mkdir -p /tmp/tfc_clips
          ffmpeg -y -f lavfi -i testsrc=size=320x240:rate=10 -t 2 /tmp/tfc_clips/gradient.mp4
          ffmpeg -y -f lavfi -i testsrc=size=320x240:rate=10 -vf noise=alls=20:allf=t+u -t 2 /tmp/tfc_clips/noise.mp4
      - name: Smoke benchmark
        run: |
          python -m timeflowcodec.bench --clips /tmp/tfc_clips --out /tmp/tfc_out --codecs tfc --presets medium --crf 23
          ls -l /tmp/tfc_out
